version: 2

# Build documentation in the docs/ directory with Sphinx
sphinx:
  builder: html
  configuration: docs/conf.py
  fail_on_warning: false

# PDF builds are disabled here because they are built in a custom fashion
# by extending the RTD build process, see below
formats:
  - epub
  - htmlzip

# This entry makes Read the Docs install uv, create the venv and export UV_PYTHON and
# UV_PROJECT_ENVIRONMENT; build.jobs.install replaces its `uv sync`.
python:
  install:
    - method: uv
      command: sync

# Set the version of Python and other tools you might need
build:
  # graphviz builds SVG files; gfortran and libopenblas build the solver from source.
  apt_packages:
    - "graphviz"
    - "gfortran"
    - "libopenblas-dev"
  os: ubuntu-22.04
  tools:
    python: "3.14"
  jobs:
    post_checkout:
      # Unshallow the git clone otherwise this may cause issues with Sphinx extensions
      - git fetch --unshallow
      # Exit code 183 cancels a pull request build that changes nothing the docs render or include.
      - |
        if [ "$READTHEDOCS_VERSION_TYPE" = external ] && git diff --quiet origin/main...HEAD -- \
            docs/ packages/pybamm/src/ packages/pybamm/pyproject.toml packages/pybamm-model-zoo/ \
            CONTRIBUTING.md RELEASE.md pyproject.toml uv.lock .readthedocs.yaml; then
          exit 183
        fi
    install:
      # Pull requests try the solver's PyPI wheel; production builds compile the checkout.
      # No single quotes in build.jobs: Read the Docs wraps each command in sh -c '...'.
      - |
        # `all` names the PyBaMM extra, not `--all-extras`
        flags="--frozen --no-default-groups --group docs --extra all"
        if [ "$READTHEDOCS_VERSION_TYPE" = external ]; then
          version=$(uv version --package pybammsolvers --short)
          if uv sync $flags --no-install-package pybammsolvers \
              && uv pip install --no-deps --only-binary pybammsolvers "pybammsolvers==$version"; then
            exit 0
          fi
        fi
        git submodule update --init --recursive
        # The solver builds without isolation and rebuilds on import, so it needs the dev group toolchain
        uv sync $flags --group dev
    # Altered PDF build and upload job, skipped on pull requests, which never publish it
    post_build:
      - |
        if [ "$READTHEDOCS_VERSION_TYPE" != external ]; then
          set -e
          mkdir --parents "$READTHEDOCS_OUTPUT/pdf/"
          # LaTeX files in docs/build/ and doctrees in docs/_build/doctrees, skipping notebooks
          python -m sphinx -T -E -b latex -d docs/_build/doctrees -D language=en docs docs/build/
          cat docs/build/latexmkrc
          # latexmk errors are tolerated as long as it still writes the PDF
          (cd docs/build/ && latexmk -r latexmkrc -pdf -f -dvi- -ps- -jobname=pybamm -interaction=nonstopmode) || true
          test -f docs/build/pybamm.pdf && echo "pybamm.pdf exists. Copying source file to $READTHEDOCS_OUTPUT/pdf/."
          cp docs/build/pybamm.pdf "$READTHEDOCS_OUTPUT/pdf/"
        fi
