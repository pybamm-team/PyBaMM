name: Build and push Docker images to Docker Hub

on:
  workflow_dispatch:
  release:
    types: [published]

permissions: {}

jobs:
  build_docker_image:
    # Skipped in forks; on releases, build only for pybamm-v* tags so
    # solver (pybammsolvers-v*) releases don't republish the image.
    if: github.repository == 'pybamm-team/PyBaMM' && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'pybamm-v'))
    name: Build image
    runs-on: ubuntu-latest
    environment: dockerhub
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          cache-binary: false
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Build and push Docker image to Docker Hub
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: scripts/Dockerfile
          tags: pybamm/pybamm:latest
          push: true
          platforms: linux/amd64
          no-cache: true

      - name: List built image(s)
        run: docker images
