# PR half of the bare metal benchmark pipeline: build the benchmark image and hand
# it off as an artifact. Nothing here needs (or is given) the Bencher API key.
#
# `pull_request` runs fork code, so it gets no secrets. benchmarks_track.yml picks
# the artifact up on `workflow_run` and does the pushing and reporting. The fork's
# code is only ever executed here (building the image) and inside Bencher's
# sandboxed runner — never in the trusted context that holds the key.
name: Benchmarks (PR)

# Drafts are skipped to save Bencher's bandwidth quota
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

env:
  PYBAMM_DISABLE_TELEMETRY: "true"
  FORCE_COLOR: 3

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    env:
      STYLE_PREFLIGHT: ${{ github.base_ref != github.event.repository.default_branch }}
    outputs:
      benchmark: ${{ steps.filter.outputs.benchmark }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ env.STYLE_PREFLIGHT == 'true' && 2 || 1 }}
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            benchmark:
              - 'packages/pybamm/src/**'
              - 'packages/pybamm/tests/benchmarks/**'
              - 'packages/pybamm/conftest.py'
              - 'packages/pybamm/pyproject.toml'
              - 'packages/pybamm/hatch_build.py'
              - 'packages/pybamm-rust/**'
              - 'packages/pybammsolvers/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'noxfile.py'
              - '.dockerignore'
              - '.github/workflows/benchmarks_pr.yml'
              - '.github/workflows/benchmarks_track.yml'

      # Run the shared check here to keep the benchmark artifact handoff independent.
      - name: Check style before starting benchmarks
        if: env.STYLE_PREFLIGHT == 'true' && steps.filter.outputs.benchmark == 'true'
        uses: $/.github/actions/check-style
        with:
          preflight: "true"

  build_solver:
    needs: changes
    if: needs.changes.outputs.benchmark == 'true'
    permissions:
      contents: read
    uses: $/.github/workflows/_build_solver_wheels.yml
    with:
      target: linux-x64
      cache_wheels: true

  # Only PRs into the default branch spend Bencher's daily registry quota
  build_image:
    name: Build benchmark image
    needs: [changes, build_solver]
    if: needs.changes.outputs.benchmark == 'true' && github.base_ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out PyBaMM repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download in-repo solver wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-linux-x64
          path: solver-wheels

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          cache-binary: false

      # Reuse, but don't write, main's layer cache so unchanged layers aren't re-pushed
      - name: Build benchmark image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: "315532800" # 1980-01-01; sets image and file times, not RUN's env
        with:
          context: .
          file: packages/pybamm/tests/benchmarks/Dockerfile
          provenance: false
          sbom: false
          cache-from: type=gha,scope=benchmark-image
          outputs: type=oci,dest=benchmark-image.tar,name=pybamm-benchmarks:pr,compression=zstd,compression-level=19,force-compression=true,rewrite-timestamp=true

      # Layers are already zstd-compressed
      - name: Upload benchmark image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-image
          path: benchmark-image.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      # benchmarks_track.yml runs on `workflow_run`, whose payload describes this
      # workflow rather than the pull request; it reads the PR refs back from here.
      - name: Upload pull request event
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-event
          path: ${{ github.event_path }}
          if-no-files-found: error
          retention-days: 1

  # Memory benchmarks assert against fixed memray limits rather than tracking a
  # series, so they stay on the GitHub runner — bare metal buys them nothing.
  benchmark_memory:
    name: Memory benchmarks
    needs: [changes, build_solver]
    if: needs.changes.outputs.benchmark == 'true'
    permissions:
      contents: read
    uses: $/.github/workflows/_nox.yml
    with:
      sessions: benchmark-memory
      target: linux-x64
      pythons: '["3.13"]'
