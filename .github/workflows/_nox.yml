# Reusable workflow: run nox session(s) against the prebuilt in-repo solver wheels.
#
# Single definition of "how to set up a runner and run a nox session", called by
# test_on_push.yml for unit tests, coverage, integration, doctests, examples,
# scripts, and memory.
#
# Gating: a caller job is the unit of merge-gating, because a matrix leg's result
# is not individually visible to `needs`. Split legs across two caller jobs and
# list only the gated one in test_on_push.yml's `ci_gate.needs`.
#
# Naming: a check is "<caller job name> / <this job's name>", so a caller without
# `name:` leaks its job id, e.g. "run_unit_tests / linux-x64 / Python 3.13".
#
# The caller must build the solver wheels first (_build_solver_wheels.yml) — this workflow
# downloads the per-platform artifact rather than building from source.
name: Run nox sessions (reusable)

on:
  workflow_call:
    inputs:
      sessions:
        description: 'Nox session(s) to run, space-separated and in order (e.g. "doctests docs").'
        required: true
        type: string
      target:
        description: "linux-x64, linux-arm64, windows-x64, macos-arm64 or macos-x64."
        required: true
        type: string
      pythons:
        description: 'JSON array of Python versions, one leg each, e.g. ["3.11", "3.15"].'
        required: true
        type: string
      fetch_depth:
        description: >-
          Checkout depth. Sessions needing git history pass 0, such as the docs
          build.
        default: 1
        required: false
        type: number
      upload_coverage:
        description: "Upload coverage.xml to Codecov after the sessions finish."
        default: false
        required: false
        type: boolean
      timeout_minutes:
        description: "Per-leg timeout. GitHub's own default is 360."
        default: 360
        required: false
        type: number
      max_parallel:
        description: "Most legs to run at once, to leave runners for other workflows."
        default: 256
        required: false
        type: number
      install_latex:
        description: "Install LaTeX on Linux, so the latexify test renders for real."
        default: false
        required: false
        type: boolean
    secrets:
      CODECOV_TOKEN:
        description: "Codecov upload token; only needed when upload_coverage is true."
        required: false

# The env context does not propagate from a caller workflow, so these must be
# repeated here rather than inherited from test_on_push.yml.
env:
  PYBAMM_DISABLE_TELEMETRY: "true"
  FORCE_COLOR: 3

jobs:
  nox:
    # The same map as _build_solver_wheels.yml's resolve job and _target.yml's rust job.
    runs-on: >-
      ${{ (inputs.target == 'linux-x64' && (vars.RUNNER_LINUX_X64 || 'ubuntu-latest'))
      || (inputs.target == 'linux-arm64' && (vars.RUNNER_LINUX_ARM64 || 'ubuntu-24.04-arm'))
      || (inputs.target == 'windows-x64' && (vars.RUNNER_WINDOWS_X64 || 'windows-2025'))
      || (inputs.target == 'macos-arm64' && (vars.RUNNER_MACOS_ARM64 || 'macos-latest'))
      || (inputs.target == 'macos-x64' && (vars.RUNNER_MACOS_X64 || 'macos-15-intel')) }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel }}
      matrix:
        python: ${{ fromJSON(inputs.pythons) }}
    name: ${{ inputs.target }} / Python ${{ matrix.python }}

    env:
      # noxfile install_locked installs the matching prebuilt solver wheel from
      # this directory instead of building the solver from source.
      PYBAMM_SOLVER_WHEELS: ${{ github.workspace }}/solver-wheels

    steps:
      - name: Check out PyBaMM repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          persist-credentials: false

      - uses: $/.github/actions/check-target-runner
        with:
          target: ${{ inputs.target }}

      - name: Install Linux system dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        if: runner.os == 'Linux'
        with:
          packages: graphviz pandoc libosmesa6 libegl1
          execute_install_scripts: true

      - name: Register graphviz plugins
        if: runner.os == 'Linux'
        run: sudo dot -c

      - name: Install LaTeX
        if: inputs.install_latex && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends texlive-latex-extra dvipng

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_COLOR: 1
          # Speed up CI
          NONINTERACTIVE: 1
        run: |
          brew analytics off
          brew install graphviz

      - name: Install Windows system dependencies
        if: runner.os == 'Windows'
        run: winget install --id Graphviz.Graphviz --exact --accept-source-agreements --accept-package-agreements

      # VTK save_gif needs OSMesa on headless Windows runners (osmesa.dll on PATH).
      - name: Setup headless OpenGL on Windows
        if: runner.os == 'Windows'
        uses: pyvista/setup-headless-display-action@10e6efb97af3cd1523828f0e22c39f0e4567f3e4 # v5.2.0
        with:
          pyvista: "false"
          mesa3d-release: "24.3.0"
          install-mesa3d-offscreen: "true"

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/pybamm-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          enable-cache: true
          # Unpruned per-PR uv caches overflow the 10 GB limit and evict solver wheels.
          prune-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install nox
        run: uv tool install nox

      - name: Download in-repo solver wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-${{ inputs.target }}
          path: solver-wheels

      - name: Run nox -s ${{ inputs.sessions }}
        # bash on every runner so the unquoted expansion below splits a
        # multi-session input ("doctests docs") into separate nox arguments.
        shell: bash
        env:
          SESSIONS: ${{ inputs.sessions }}
        run: nox -s $SESSIONS

      - name: Upload coverage report
        if: inputs.upload_coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
