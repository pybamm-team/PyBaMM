# Reusable workflow: build pybammsolvers wheels (+ optional sdist) from the
# in-repo source.
#
# Releases build fresh, uncached wheels from this workflow, so a cache can never
# leak into PyPI; the test and benchmark workflows use the cache.
#
# Platform selection: callers pass `platforms` / `macos_archs` to build only the
# wheels their downstream jobs consume; both default to all platforms.
#
# MACOS_ARM64_RUNNER / MACOS_X86_64_RUNNER repo variables override the macOS
# labels, to move off a contended image without a code change.
#
# Windows is built here via cibuildwheel + vcpkg — the ONLY way this solver has
# ever been built on Windows. PyBaMM's matrix must not invent a from-source
# Windows build; it consumes these wheels.
#
# Caching: `resolve` restores on Ubuntu so a hit needs no macOS/Windows runner, and
# `save_cache` stores misses from Ubuntu, the only OS family that can restore them.
#
# Artifacts are named wheels_<runner.os>_<runner.arch>, e.g. wheels_macOS_ARM64.
name: Build solver wheels (reusable)

on:
  workflow_call:
    inputs:
      cache_wheels:
        description: "Restore/save per-platform wheels keyed on the solver source hash, skipping the build on a cache hit."
        default: false
        required: false
        type: boolean
      build_sdist:
        description: "Also build the sdist (needed for release publishing; not needed for PR testing)."
        default: false
        required: false
        type: boolean
      save_vcpkg_logs:
        description: "Upload vcpkg build logs for Windows (useful for debugging CI failures)."
        default: false
        required: false
        type: boolean
      platforms:
        description: 'JSON array of non-macOS targets to build, subset of ["linux", "windows"]. Lets a caller build only the wheels its downstream jobs consume.'
        default: '["linux", "windows"]'
        required: false
        type: string
      macos_archs:
        description: 'JSON array of macOS architectures to build, subset of ["x86_64", "arm64"]; empty [] skips macOS entirely.'
        default: '["x86_64", "arm64"]'
        required: false
        type: string

defaults:
  run:
    working-directory: packages/pybammsolvers

env:
  CIBW_BUILD_VERBOSITY: 2
  # Skip PyPy, MUSL, and free-threaded Python builds (CasADi lacks cp31Xt wheels)
  CIBW_SKIP: "pp* *musllinux* cp314t* cp315t*"
  FORCE_COLOR: 3

jobs:
  resolve:
    name: Resolve cached wheels
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    outputs:
      key: ${{ steps.key.outputs.key }}
      linux: ${{ steps.plan.outputs.linux }}
      macos: ${{ steps.plan.outputs.macos }}
      windows: ${{ steps.plan.outputs.windows }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The solver tree hash covers its submodule pins; this file's hash makes a
      # change to the build recipe rebuild too.
      - name: Compute cache key
        id: key
        run: |
          solver=$(git rev-parse HEAD:packages/pybammsolvers)
          recipe=$(git rev-parse HEAD:.github/workflows/_build_solver_wheels.yml)
          echo "key=$solver-$recipe" >> "$GITHUB_OUTPUT"

      # One cache entry per target, so a caller that wants only some platforms can
      # still find each of them.
      - name: Restore Linux x86_64 wheels
        id: linux_x64
        if: inputs.cache_wheels && contains(fromJSON(inputs.platforms), 'linux')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wheelhouse/Linux_X64
          key: solver-wheels-Linux_X64-${{ steps.key.outputs.key }}
      - name: Upload cached Linux x86_64 wheels
        if: steps.linux_x64.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels_Linux_X64
          path: wheelhouse/Linux_X64/*.whl
          if-no-files-found: error

      - name: Restore Linux aarch64 wheels
        id: linux_arm64
        if: inputs.cache_wheels && contains(fromJSON(inputs.platforms), 'linux')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wheelhouse/Linux_ARM64
          key: solver-wheels-Linux_ARM64-${{ steps.key.outputs.key }}
      - name: Upload cached Linux aarch64 wheels
        if: steps.linux_arm64.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels_Linux_ARM64
          path: wheelhouse/Linux_ARM64/*.whl
          if-no-files-found: error

      - name: Restore Windows wheels
        id: windows_x64
        if: inputs.cache_wheels && contains(fromJSON(inputs.platforms), 'windows')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wheelhouse/Windows_X64
          key: solver-wheels-Windows_X64-${{ steps.key.outputs.key }}
      - name: Upload cached Windows wheels
        if: steps.windows_x64.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels_Windows_X64
          path: wheelhouse/Windows_X64/*.whl
          if-no-files-found: error

      - name: Restore macOS x86_64 wheels
        id: macos_x64
        if: inputs.cache_wheels && contains(fromJSON(inputs.macos_archs), 'x86_64')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wheelhouse/macOS_X64
          key: solver-wheels-macOS_X64-${{ steps.key.outputs.key }}
      - name: Upload cached macOS x86_64 wheels
        if: steps.macos_x64.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels_macOS_X64
          path: wheelhouse/macOS_X64/*.whl
          if-no-files-found: error

      - name: Restore macOS arm64 wheels
        id: macos_arm64
        if: inputs.cache_wheels && contains(fromJSON(inputs.macos_archs), 'arm64')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wheelhouse/macOS_ARM64
          key: solver-wheels-macOS_ARM64-${{ steps.key.outputs.key }}
      - name: Upload cached macOS arm64 wheels
        if: steps.macos_arm64.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels_macOS_ARM64
          path: wheelhouse/macOS_ARM64/*.whl
          if-no-files-found: error

      - name: Plan native builds for the cache misses
        id: plan
        env:
          LINUX_X64: ${{ contains(fromJSON(inputs.platforms), 'linux') && steps.linux_x64.outputs.cache-hit != 'true' }}
          LINUX_ARM64: ${{ contains(fromJSON(inputs.platforms), 'linux') && steps.linux_arm64.outputs.cache-hit != 'true' }}
          WINDOWS_X64: ${{ contains(fromJSON(inputs.platforms), 'windows') && steps.windows_x64.outputs.cache-hit != 'true' }}
          MACOS_X64: ${{ contains(fromJSON(inputs.macos_archs), 'x86_64') && steps.macos_x64.outputs.cache-hit != 'true' }}
          MACOS_ARM64: ${{ contains(fromJSON(inputs.macos_archs), 'arm64') && steps.macos_arm64.outputs.cache-hit != 'true' }}
        run: |
          linux=() macos=() targets=()
          if [ "$LINUX_X64" = true ]; then linux+=(x86_64); targets+=(Linux_X64); fi
          if [ "$LINUX_ARM64" = true ]; then linux+=(aarch64); targets+=(Linux_ARM64); fi
          if [ "$WINDOWS_X64" = true ]; then targets+=(Windows_X64); fi
          if [ "$MACOS_X64" = true ]; then macos+=(x86_64); targets+=(macOS_X64); fi
          if [ "$MACOS_ARM64" = true ]; then macos+=(arm64); targets+=(macOS_ARM64); fi
          json() { jq -nc '$ARGS.positional' --args "$@"; }
          {
            echo "linux=$(json "${linux[@]}")"
            echo "macos=$(json "${macos[@]}")"
            echo "windows=$WINDOWS_X64"
            echo "targets=$(json "${targets[@]}")"
          } >> "$GITHUB_OUTPUT"

  build_windows_wheels:
    name: Wheels (Windows)
    needs: resolve
    if: needs.resolve.outputs.windows == 'true'
    runs-on: windows-2025
    permissions:
      contents: read
    env:
      # Single source of truth for the vcpkg tag — shared by the clone and the
      # binary-cache key so a version bump rotates the cache, never poisons it.
      VCPKG_TAG: "2026.06.24"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.13

      # Persist vcpkg's binary cache (built ports: casadi, sundials, suitesparse,
      # openblas) across runs, so a PR that only changes solver source rebuilds
      # the solver, not its dependencies. Gated to the cached (PR/periodic) path;
      # releases build fresh (no cache). restore-keys lets a new branch reuse
      # main's ports — vcpkg rebuilds only ABI-mismatched ones.
      - name: Cache vcpkg binary artifacts
        id: vcpkgcache
        if: inputs.cache_wheels
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\vcpkg-archives
          key: vcpkg-x64-windows-static-md-${{ env.VCPKG_TAG }}-${{ hashFiles('packages/pybammsolvers/vcpkg.json', 'packages/pybammsolvers/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-x64-windows-static-md-${{ env.VCPKG_TAG }}-

      # vcpkg (see VCPKG_TAG): sundials comes from the pybamm-team registry; its
      # klu feature needs only suitesparse-klu (no LAPACK/Fortran/MSYS2 chain).
      - name: Install vcpkg on Windows
        run: |
          cd C:\
          rm -r -fo 'C:\vcpkg'
          git clone https://github.com/microsoft/vcpkg --branch ${{ env.VCPKG_TAG }}
          cd vcpkg
          .\bootstrap-vcpkg.bat
          # Binary-cache dir must exist before the build; -Force no-ops (keeps
          # contents) if the cache-restore step already created it.
          New-Item -ItemType Directory -Force -Path C:\vcpkg-archives | Out-Null

      - name: Build wheels on Windows
        run: pipx run cibuildwheel --output-dir wheelhouse
        env:
          # VCPKG_DEFAULT_BINARY_CACHE points vcpkg's default files cache at a
          # pinned dir that actions/cache persists across runs (see the cache
          # step); ports are shared across the 5 Python builds AND across runs,
          # so only a dependency change rebuilds from source.
          # No CMAKE_GENERATOR pin: CMake resolves the image's installed VS
          # (year-pins break when runner images drop that VS release).
          # Forward-slash paths: cibuildwheel shell-parses these values, so a
          # backslash path arrives drive-relative (C:vcpkg) and breaks vcpkg's children.
          CIBW_ENVIRONMENT: >
            VCPKG_ROOT_DIR=C:/vcpkg
            VCPKG_DEFAULT_TRIPLET=x64-windows-static-md
            VCPKG_DEFAULT_BINARY_CACHE=C:/vcpkg-archives
            VCPKG_FEATURE_FLAGS=manifests,registries
            CMAKE_GENERATOR_PLATFORM=x64
          CIBW_ARCHS: AMD64
          CIBW_BEFORE_BUILD: python -m pip install delvewheel
          CIBW_REPAIR_WHEEL_COMMAND: delvewheel repair --add-path C:/Windows/System32 -w {dest_dir} {wheel}
          CIBW_TEST_EXTRAS: "dev"
          CIBW_TEST_COMMAND: |
            python -m pytest {project}/tests
      - name: Upload vcpkg build logs
        if: ${{ inputs.save_vcpkg_logs && always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vcpkg-logs-windows
          path: |
            C:\vcpkg\buildtrees\sundials\*.log
            C:\vcpkg\buildtrees\detect_compiler\*.log
          if-no-files-found: ignore
      - name: Upload Windows wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels_${{ runner.os }}_${{ runner.arch }}
          path: packages/pybammsolvers/wheelhouse/*.whl
          if-no-files-found: error

  build_manylinux_wheels:
    name: Wheels (Linux ${{ matrix.arch }})
    needs: resolve
    if: needs.resolve.outputs.linux != '[]'
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.resolve.outputs.linux) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.13

      - name: Build wheels on Linux
        run: pipx run cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          # aarch64 requires GCC>=11 libstdc++ for CasADi's C++11-ABI wheel;
          # ignored for the x86_64 build (which uses the default manylinux2014).
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_34
          # x86_64 is CentOS 7 with EPEL disabled (CasADi's wheel uses the legacy
          # libstdc++ ABI); aarch64 is AlmaLinux 9, with openblas/lapack in CRB.
          CIBW_BEFORE_ALL_LINUX: >-
            ${{ matrix.arch == 'aarch64'
            && 'dnf config-manager --set-enabled crb && dnf -y install openblas-devel lapack-devel && python install_KLU_Sundials.py'
            || 'yum -y --disablerepo=epel install openblas-devel lapack-devel && python install_KLU_Sundials.py' }}
          # libcasadi ships as a pip dep (resolved at runtime via $ORIGIN/../casadi).
          # The soname stayed at 3.7 in CasADi 3.8; it does not track the release.
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: auditwheel repair --exclude libcasadi.so.3.7 -w {dest_dir} {wheel}
          CIBW_TEST_EXTRAS: "dev"
          CIBW_TEST_COMMAND: |
            set -e -x
            python -m pytest {project}/tests

      - name: Upload wheels for Linux
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels_${{ runner.os }}_${{ runner.arch }}
          path: packages/pybammsolvers/wheelhouse/*.whl
          if-no-files-found: error

  build_macos_wheels:
    name: Wheels (macOS ${{ matrix.arch }})
    needs: resolve
    if: needs.resolve.outputs.macos != '[]'
    runs-on: ${{ matrix.arch == 'arm64' && (vars.MACOS_ARM64_RUNNER || 'macos-latest') || (vars.MACOS_X86_64_RUNNER || 'macos-15-intel') }}
    permissions:
      contents: read
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.resolve.outputs.macos) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'
          persist-credentials: false

      # A repo variable can point a label at the other architecture; stop before
      # building the wrong wheels under this target's name.
      - name: Check the runner architecture
        if: runner.arch != (matrix.arch == 'arm64' && 'ARM64' || 'X64')
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          echo "::error::The $ARCH build got a $RUNNER_ARCH runner; check the MACOS_*_RUNNER repo variables."
          exit 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.13

      - name: Install Fortran compiler
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_COLOR: 1
          NONINTERACTIVE: 1
        run: |
          brew analytics off
          brew install libomp
          brew reinstall gcc

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build wheels on macOS
        shell: bash
        run: |
            set -e -x

            # Set LLVM-OpenMP URL
            if [[ $(uname -m) == "x86_64" ]]; then
              OPENMP_URL="https://anaconda.org/conda-forge/llvm-openmp/11.1.0/download/osx-64/llvm-openmp-11.1.0-hda6cdc1_1.tar.bz2"
            elif [[ $(uname -m) == "arm64" ]]; then
              OPENMP_URL="https://anaconda.org/conda-forge/llvm-openmp/11.1.0/download/osx-arm64/llvm-openmp-11.1.0-hf3c4609_1.tar.bz2"
            fi

            export SDKROOT=${SDKROOT:-$(xcrun --show-sdk-path)}
            SOLVER_LIB_PATH=$(pwd)/.idaklu/lib

            mkdir -p $SOLVER_LIB_PATH

            # Can't download LLVM-OpenMP directly, use conda and set environment variables
            brew install miniforge
            conda create -n pybammsolvers-dev $OPENMP_URL
            if [[ $(uname -m) == "x86_64" ]]; then
              PREFIX="/usr/local/Caskroom/miniforge/base/envs/pybammsolvers-dev"
            elif [[ $(uname -m) == "arm64" ]]; then
              PREFIX="/opt/homebrew/Caskroom/miniforge/base/envs/pybammsolvers-dev"
            fi

            # Copy libomp.dylib from PREFIX to $SOLVER_LIB_PATH, needed for wheel repair
            cp $PREFIX/lib/libomp.dylib $SOLVER_LIB_PATH/.
            install_name_tool -id $SOLVER_LIB_PATH/libomp.dylib $SOLVER_LIB_PATH/libomp.dylib
            codesign --force --sign - $SOLVER_LIB_PATH/libomp.dylib

            export CC=/usr/bin/clang
            export CXX=/usr/bin/clang++
            # Link conda libomp (not Homebrew's — too-high MACOSX_DEPLOYMENT_TARGET).
            # One libomp source ensures delocate bundles a single copy.
            export CPPFLAGS="$CPPFLAGS -Xpreprocessor -fopenmp"
            export CFLAGS="$CFLAGS -I$PREFIX/include"
            export CXXFLAGS="$CXXFLAGS -I$PREFIX/include"
            export LDFLAGS="$LDFLAGS -L$PREFIX/lib -lomp"

            # install_KLU_Sundials.py checks CIBUILDWHEEL to decide whether to
            # inject Homebrew OpenMP overrides; set it so it uses conda libomp.
            export CIBUILDWHEEL="1"

            python install_KLU_Sundials.py
            python -m cibuildwheel --output-dir wheelhouse
        env:
          # 10.13 for Intel, 11.0 for Apple Silicon
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.arch == 'arm64' && '11.0' || '10.13' }}
          CIBW_ARCHS_MACOS: auto
          CIBW_BEFORE_BUILD: python -m pip install delocate
          # libcasadi ships as a pip dep (resolved at runtime via
          # @loader_path/../casadi); delocate can't locate it at repair time
          # since it lives in the build venv — hence --exclude + --ignore-missing-dependencies.
          CIBW_REPAIR_WHEEL_COMMAND: |
            if [[ $(uname -m) == "x86_64" ]]; then
              delocate-listdeps {wheel} && delocate-wheel -v -w {dest_dir} {wheel} --exclude libcasadi --ignore-missing-dependencies
            elif [[ $(uname -m) == "arm64" ]]; then
              # Use higher macOS target for now since casadi/libc++.1.0.dylib is still not fixed
              delocate-listdeps {wheel} && delocate-wheel -v -w {dest_dir} {wheel} --exclude libcasadi --ignore-missing-dependencies --require-target-macos-version 11.1
              for file in {dest_dir}/*.whl; do mv "$file" "${file//macosx_11_1/macosx_11_0}"; done
            fi
          CIBW_TEST_EXTRAS: "dev"
          CIBW_TEST_COMMAND: |
            set -e -x
            python -m pytest {project}/tests

      - name: Upload wheels for macOS (amd64, arm64)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels_${{ runner.os }}_${{ runner.arch }}
          path: packages/pybammsolvers/wheelhouse/*.whl
          if-no-files-found: error

  # Saves from Ubuntu, the OS `resolve` restores on. A failed build has no
  # artifact, so its target is skipped rather than cached.
  save_cache:
    name: Cache wheels (${{ matrix.target }})
    needs: [resolve, build_windows_wheels, build_manylinux_wheels, build_macos_wheels]
    if: ${{ !cancelled() && inputs.cache_wheels && needs.resolve.result == 'success' && needs.resolve.outputs.targets != '[]' }}
    runs-on: ubuntu-latest
    permissions: {}
    defaults:
      run:
        working-directory: .
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.targets) }}
    steps:
      - name: Download built wheels
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels_${{ matrix.target }}
          path: wheelhouse/${{ matrix.target }}

      - name: Save wheels to the cache
        if: steps.download.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wheelhouse/${{ matrix.target }}
          key: solver-wheels-${{ matrix.target }}-${{ needs.resolve.outputs.key }}

      - name: Warn that the wheels were not cached
        if: steps.download.outcome == 'failure'
        env:
          TARGET: ${{ matrix.target }}
        run: echo "::warning::No wheels_$TARGET artifact to cache, so the next run rebuilds it natively."

  build_sdist:
    name: Build SDist
    if: inputs.build_sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.13

      - name: Build SDist
        run: pipx run build --sdist

      - name: Upload SDist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: packages/pybammsolvers/dist/*.tar.gz
          if-no-files-found: error
