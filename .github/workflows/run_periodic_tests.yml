name: Scheduled

on:
  workflow_dispatch:
  # Off the hour, where GitHub delays schedules least: "0 3 * * *" started 6-8 hours late.
  schedule:
    - cron: "17 2 * * *"


permissions: {}

env:
  PYBAMM_DISABLE_TELEMETRY: "true"
  FORCE_COLOR: 3

concurrency:
  # github.workflow: name of the workflow, so that we don't cancel other workflows
  # github.event.pull_request.number || github.ref: pull request number or branch name if not a pull request
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel in-progress runs when a new workflow with the same group name is triggered
  # This avoids workflow runs on both pushes and PRs
  cancel-in-progress: true

jobs:
  # Build the solver wheels once (like test_on_push.yml) and download them per
  # job; otherwise every nox/uv sync would compile the solver from source and fail.
  build_solver:
    name: Solver wheels (Linux, Windows)
    # Pass contents:read to the reusable workflow (top-level permissions are {},
    # so its checkout would otherwise get no token scope).
    permissions:
      contents: read
    uses: $/.github/workflows/_build_solver_wheels.yml
    with:
      cache_wheels: true
      build_sdist: false
      macos_archs: '[]'

  # Separate, so the Linux and Windows jobs never wait for a macOS runner.
  build_solver_macos:
    name: Solver wheels (macOS)
    permissions:
      contents: read
    uses: $/.github/workflows/_build_solver_wheels.yml
    with:
      cache_wheels: true
      build_sdist: false
      platforms: '[]'

  run_unit_integration_and_coverage_tests:
    needs: build_solver
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      # Linux and Windows sweep plus the ARM Linux endpoints; macOS is in run_macos_tests.
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: ubuntu-24.04-arm
            python-version: "3.11"
          - os: ubuntu-24.04-arm
            python-version: "3.15"
    name: Tests (${{ matrix.os }} / Python ${{ matrix.python-version }})

    env:
      # noxfile install_locked installs the matching prebuilt solver wheel from
      # this directory instead of building the solver from source.
      PYBAMM_SOLVER_WHEELS: ${{ github.workspace }}/solver-wheels

    steps:
      - name: Check out PyBaMM repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install graphviz pandoc libosmesa6 libegl1

      # One leg is enough to run the latexify test that renders through real LaTeX.
      - name: Install TeXLive for Linux
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: sudo apt-get install --no-install-recommends texlive-latex-extra dvipng

      - name: Install Windows system dependencies
        if: matrix.os == 'windows-latest'
        run: winget install --id Graphviz.Graphviz --exact --accept-source-agreements --accept-package-agreements

      # VTK save_gif needs OSMesa on headless Windows runners (osmesa.dll on PATH).
      - name: Setup headless OpenGL on Windows
        if: matrix.os == 'windows-latest'
        uses: pyvista/setup-headless-display-action@10e6efb97af3cd1523828f0e22c39f0e4567f3e4 # v5.2.0
        with:
          pyvista: "false"
          mesa3d-release: "24.3.0"
          install-mesa3d-offscreen: "true"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          enable-cache: true
          prune-cache: true

      - name: Install nox
        run: uv tool install nox

      - name: Download in-repo solver wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels_${{ runner.os }}_${{ runner.arch }}
          path: solver-wheels

      - name: Run unit tests for ${{ matrix.os }} with Python ${{ matrix.python-version }}
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.13'
        run: nox -s unit

      - name: Run coverage tests for ${{ matrix.os }} with Python ${{ matrix.python-version }}
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: nox -s coverage

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run integration tests for ${{ matrix.os }} with Python ${{ matrix.python-version }}
        if: matrix.os != 'ubuntu-24.04-arm'
        run: nox -s integration

  # Capped so the sweep leaves macOS runners for pull requests: uncapped, it held all
  # five of the org's concurrent macOS slots for about 95 minutes.
  run_macos_tests:
    needs: build_solver_macos
    name: Tests
    permissions:
      contents: read
    uses: $/.github/workflows/_nox.yml
    with:
      sessions: "unit integration"
      max_parallel: 2
      legs: >-
        [{"os": "macos-x86_64", "python": "3.11"},
         {"os": "macos-x86_64", "python": "3.12"},
         {"os": "macos-x86_64", "python": "3.13"},
         {"os": "macos-x86_64", "python": "3.14"},
         {"os": "macos-x86_64", "python": "3.15"},
         {"os": "macos-arm64", "python": "3.11"},
         {"os": "macos-arm64", "python": "3.12"},
         {"os": "macos-arm64", "python": "3.13"},
         {"os": "macos-arm64", "python": "3.14"},
         {"os": "macos-arm64", "python": "3.15"}]

  run_doctests:
    needs: build_solver
    name: Doctests
    permissions:
      contents: read
    uses: $/.github/workflows/_nox.yml
    with:
      sessions: "doctests docs"
      # Full clone: the docs build's sphinx_last_updated_by_git needs the history.
      fetch_depth: 0
      legs: '[{"os": "ubuntu-latest", "python": "3.13"}]'

  run_example_tests:
    needs: build_solver
    name: Example notebooks
    permissions:
      contents: read
    uses: $/.github/workflows/_nox.yml
    with:
      sessions: examples
      legs: '[{"os": "ubuntu-latest", "python": "3.13"}]'

  run_scripts_tests:
    needs: build_solver
    name: Example scripts
    permissions:
      contents: read
    uses: $/.github/workflows/_nox.yml
    with:
      sessions: scripts
      legs: '[{"os": "ubuntu-latest", "python": "3.13"}]'
