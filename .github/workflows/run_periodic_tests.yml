name: Scheduled

on:
  workflow_dispatch:
  # Off the hour, where GitHub delays schedules least: "0 3 * * *" started 6-8 hours late.
  schedule:
    - cron: "17 2 * * *"


permissions: {}

env:
  PYBAMM_DISABLE_TELEMETRY: "true"
  FORCE_COLOR: 3

concurrency:
  # github.workflow: name of the workflow, so that we don't cancel other workflows
  # github.event.pull_request.number || github.ref: pull request number or branch name if not a pull request
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel in-progress runs when a new workflow with the same group name is triggered
  # This avoids workflow runs on both pushes and PRs
  cancel-in-progress: true

jobs:
  # Build the solver wheels once (like test_on_push.yml) and download them per
  # job; otherwise every nox/uv sync would compile the solver from source and fail.
  build_solver:
    name: Solver wheels (linux-x64)
    # Pass contents:read to the reusable workflow (top-level permissions are {},
    # so its checkout would otherwise get no token scope).
    permissions:
      contents: read
    uses: $/.github/workflows/_build_solver_wheels.yml
    with:
      target: linux-x64
      cache_wheels: true

  run_tests:
    needs: build_solver
    name: Tests
    permissions:
      contents: read
    uses: $/.github/workflows/_nox.yml
    with:
      sessions: "unit integration"
      target: linux-x64
      pythons: '["3.11", "3.12", "3.14", "3.15"]'

  run_coverage:
    needs: build_solver
    name: Coverage
    permissions:
      contents: read
    uses: $/.github/workflows/_nox.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      sessions: coverage
      target: linux-x64
      pythons: '["3.13"]'
      upload_coverage: true
      install_latex: true

  # Its own job, as in test_on_push.yml, so a failure here can't skip the upload.
  run_integration_tests:
    needs: build_solver
    name: Integration tests
    permissions:
      contents: read
    uses: $/.github/workflows/_nox.yml
    with:
      sessions: integration
      target: linux-x64
      pythons: '["3.13"]'

  # One leg at a time per pool, so the sweep never holds more than one runner of
  # any scarce pool, wherever GitHub's schedule delay lands it.
  run_platform_tests:
    name: ${{ matrix.target }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [linux-arm64, windows-x64, macos-arm64, macos-x64]
    uses: $/.github/workflows/_target.yml
    with:
      target: ${{ matrix.target }}
      pythons: '["3.11", "3.12", "3.13", "3.14", "3.15"]'
      sessions: "unit integration"
      max_parallel: 1

  run_doctests:
    needs: build_solver
    name: Doctests
    permissions:
      contents: read
    uses: $/.github/workflows/_nox.yml
    with:
      sessions: "doctests docs"
      # Full clone: the docs build's sphinx_last_updated_by_git needs the history.
      fetch_depth: 0
      target: linux-x64
      pythons: '["3.13"]'

  run_example_tests:
    needs: build_solver
    name: Example notebooks
    permissions:
      contents: read
    uses: $/.github/workflows/_nox.yml
    with:
      sessions: examples
      target: linux-x64
      pythons: '["3.13"]'

  run_scripts_tests:
    needs: build_solver
    name: Example scripts
    permissions:
      contents: read
    uses: $/.github/workflows/_nox.yml
    with:
      sessions: scripts
      target: linux-x64
      pythons: '["3.13"]'
