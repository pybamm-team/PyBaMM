# Baseline timing benchmarks for `main`, run on Bencher Bare Metal.
#
# Nothing is timed on the GitHub runner. This workflow builds the benchmark image,
# pushes it to Bencher's OCI registry, and `bencher run --image` hands it to a
# dedicated bare metal runner; results come back attached to a Bencher report.
# Running on identical hardware every time is the point — GitHub runners are far
# too noisy to compare a commit against its predecessor.
#
# PR benchmarks live in benchmarks_pr.yml / benchmarks_track.yml, which are split
# in two so that fork code never runs in a context holding the API key.
#
# Pushes run the core suite; the slow_bench sweeps run on a weekday schedule.
name: Benchmarks (main)

on:
  push:
    branches: main
  schedule:
    - cron: "0 3 * * 1-5"
  workflow_dispatch:

permissions: {}

env:
  PYBAMM_DISABLE_TELEMETRY: "true"
  FORCE_COLOR: 3
  BENCHER_PROJECT: pybamm
  # The image repository must be named after the Bencher project slug.
  BENCHER_REGISTRY: registry.bencher.dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # The image installs the prebuilt in-repo solver wheel, so benchmarks track
  # pybammsolvers changes too rather than the last PyPI release.
  build_solver:
    # Reports are filed under --branch main, so never run from a fork or branch.
    if: github.repository == 'pybamm-team/PyBaMM' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: $/.github/workflows/_build_solver_wheels.yml
    with:
      cache_wheels: true
      build_sdist: false
      platforms: '["linux"]'
      macos_runners: '[]'

  build_image:
    name: Build benchmark image
    needs: build_solver
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out PyBaMM repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download in-repo solver wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels_manylinux
          path: solver-wheels

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          cache-binary: false

      # The registry pairs a project key with the project slug as the username
      # (a user key would pair with the owner's email instead), so BENCHER must
      # hold a `bencher_run_*` key.
      - name: Log in to the Bencher registry
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER }}
        run: |
          printf '%s' "$BENCHER_API_KEY" \
            | docker login "$BENCHER_REGISTRY" --username "$BENCHER_PROJECT" --password-stdin

      # Cached layers keep their digests, so the push skips unchanged layers
      - name: Build and push benchmark image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/pybamm/tests/benchmarks/Dockerfile
          provenance: false
          sbom: false
          cache-from: type=gha,scope=benchmark-image
          cache-to: type=gha,scope=benchmark-image
          outputs: type=image,name=${{ env.BENCHER_REGISTRY }}/${{ env.BENCHER_PROJECT }}:main-${{ github.sha }},push=true,oci-mediatypes=true,compression=zstd,compression-level=19,force-compression=true

  benchmark_time:
    name: Timing benchmarks (bare metal, ${{ matrix.suite }})
    needs: build_image
    runs-on: ubuntu-latest
    permissions:
      checks: write
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(github.event_name == 'push' && '["core"]' || '["model-options", "setup"]') }}
    env:
      IMAGE_TAG: main-${{ github.sha }}
      SUITE: ${{ matrix.suite }}

    steps:
      - uses: bencherdev/bencher@f80847436d7157936b40525db4c2a1064124f04a # v0.6.13

      # Fewer rounds keep each sweep inside Bencher's 5 minute job limit
      - name: Track main branch benchmarks with Bencher
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sweep="-m time_bench --benchmark-max-time=0.5 --benchmark-min-rounds=3"
          case "$SUITE" in
            core) selection="-m 'time_bench and not slow_bench'" ;;
            model-options) selection="test_model_options.py $sweep" ;;
            setup) selection="test_setup_models_and_sims.py $sweep" ;;
          esac
          bencher run \
            --project "$BENCHER_PROJECT" \
            --image "$BENCHER_PROJECT:$IMAGE_TAG" \
            --branch main \
            --hash "$GITHUB_SHA" \
            --testbed bare-metal \
            --spec intel-v1 \
            --adapter python_pytest \
            --file /tmp/results.json \
            --threshold-measure latency \
            --threshold-test percentage \
            --threshold-upper-boundary 0.1 \
            --threshold-max-sample-size 50 \
            --thresholds-reset \
            --error-on-alert \
            --github-actions "$GITHUB_TOKEN" \
            "pytest $selection -v -o addopts= --benchmark-group-by func --benchmark-disable-gc --benchmark-json /tmp/results.json"
