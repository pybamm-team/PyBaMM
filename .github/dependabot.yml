version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # group updates in a single PR
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # Benchmark image's digest-pinned base
  - package-ecosystem: "docker"
    directory: "/packages/pybamm/tests/benchmarks"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    cooldown:
      default-days: 7

  # Maintain Python dependencies via uv lockfile
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    exclude-paths:
      - "LICENSE.txt"
    groups:
      python-dependencies:
        patterns:
          - "*"
      python-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    cooldown:
      default-days: 7
