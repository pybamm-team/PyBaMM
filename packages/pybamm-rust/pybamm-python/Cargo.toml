[package]
name = "pybamm-python"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[features]
default = ["serialize", "diffsol"]
serialize = ["pybamm-core/serialize", "dep:bincode"]
diffsol = ["pybamm-core/diffsol", "dep:rayon"]

[dependencies]
pybamm-core = { path = "../pybamm-core", default-features = false }
pyo3 = { version = "0.30" }
numpy = "0.30"
bincode = { version = "1", optional = true }
rayon = { version = "1", optional = true }

[lints]
workspace = true
