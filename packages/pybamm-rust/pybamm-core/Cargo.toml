[package]
name = "pybamm-core"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
rustc-hash = "2"
thiserror = "2"
# For the primitives `f64` leaves non-deterministic, so values match on every target;
# `test_primitives_match_libm` pins its outputs, so a bump that moves bits fails.
libm = "0.2"
serde = { version = "1", features = ["derive"], optional = true }
bincode = { version = "1", optional = true }
diffsol = { version = "0.18.0", optional = true, default-features = false, features = ["faer"] }
faer = { version = "0.24", optional = true }
rayon = { version = "1", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[features]
default = ["diffsol"]
serialize = ["serde", "bincode"]
diffsol = ["dep:diffsol", "dep:faer", "dep:rayon"]

[[test]]
name = "test_faer_global_parallelism"
required-features = ["diffsol"]

[[bench]]
name = "compile"
harness = false

[[bench]]
name = "eval"
harness = false

[[bench]]
name = "sparsity"
harness = false
required-features = ["serialize"]

[[bench]]
name = "solver_setup"
harness = false
required-features = ["serialize", "diffsol"]

[[bench]]
name = "sens_params"
harness = false
required-features = ["diffsol"]

[[bench]]
name = "derivatives"
harness = false
required-features = ["serialize"]

[lints]
workspace = true
