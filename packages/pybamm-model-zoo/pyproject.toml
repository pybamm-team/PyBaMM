[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "pybamm-model-zoo"
version = "0.1.0"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
description = "Community- and partner-contributed battery models for PyBaMM"
authors = [{ name = "The PyBaMM Team", email = "pybamm@pybamm.org" }]
maintainers = [{ name = "The PyBaMM Team", email = "pybamm@pybamm.org" }]
requires-python = ">=3.10, <3.15"
readme = { file = "README.md", content-type = "text/markdown" }
keywords = ["battery", "electrochemistry", "lithium-ion", "modelling", "pybamm", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # Every model's floor: a model that needs a newer PyBaMM raises it.
    "pybamm>=26.10",
    "packaging>=23.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.urls]
Homepage = "https://pybamm.org"
Documentation = "https://docs.pybamm.org/en/latest/source/model_zoo/index.html"
Repository = "https://github.com/pybamm-team/PyBaMM/tree/main/packages/pybamm-model-zoo"
Changelog = "https://github.com/pybamm-team/PyBaMM/blob/main/packages/pybamm-model-zoo/CHANGELOG.md"
Issues = "https://github.com/pybamm-team/PyBaMM/issues"

# A model's dependencies belong in a per-model `zoo-<slug>` extra, never in the
# base dependencies above: workspace members share one lockfile and one dev venv.
[project.optional-dependencies]
# The aggregate is deliberately not named `all`: `uv sync --extra all` applies it
# to every member, dragging every model's heavy dependencies into the dev env.
zoo-all = ["pybamm-model-zoo[zoo-multilayer-3d-thermal]"]
zoo-multilayer-3d-thermal = ["pybamm[fem]"]

# The repository's .gitignore excludes data files (*.csv, *.txt, *.mat, ...) that a
# model folder may track, and hatchling would silently drop them from both targets.
[tool.hatch.build]
artifacts = ["/src/pybamm_model_zoo/**"]
exclude = ["__pycache__", "*.py[cod]"]

[tool.hatch.build.targets.wheel]
packages = ["src/pybamm_model_zoo"]

# pytest treats a pyproject.toml as the inifile only when it carries this table,
# and the workspace root has none, so `--strict-markers` would reject the markers.
[tool.pytest.ini_options]
minversion = "9.0"
required_plugins = ["pytest-xdist", "pytest-mock"]
addopts = ["-nauto", "-vra", "--strict-config", "--strict-markers"]
testpaths = ["tests", "src/pybamm_model_zoo"]
console_output_style = "progress"
xfail_strict = true
markers = [
    "zoo: mark test as part of the model zoo suite",
    "gating: mark test as merge-gating (derived from a manifest's `core` tier)",
    "zoo_examples: mark test as a model zoo example script",
    "zoo_model(slug): mark test as belonging to one model, for --zoo-model",
    "unit: mark test as a unit test",
    "integration: mark test as an integration test",
]
# No blanket class ignores: this suite is small enough to keep clean. The weekly
# job relaxes them for legacy releases, where a warning is not a zoo regression.
filterwarnings = ["error"]
log_cli = true
log_level = "INFO"
log_format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
